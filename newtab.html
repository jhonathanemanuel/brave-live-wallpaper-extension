<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nova Guia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <link type="image/png" sizes="32x32" rel="icon" href="icons8-fnaf-32.png">
</head>
<body>
    <video autoplay muted loop id="bg-video">
        <source id="video-source" src="background.mp4" type="video/mp4">
        Seu navegador não suporta vídeos.
    </video>

    <div class="content">
        <div class="main-container">
            <!-- Relógio Moderno e Discreto -->
            <div id="clock" class="clock-display hidden-clock">
                <span id="clock-time">00:00</span><span id="clock-seconds">:00</span>
            </div>

            <div class="search-wrapper">
                <form action="https://search.brave.com/search" method="GET" class="search-form">
                    <input type="text" name="q" placeholder="O que você está procurando?" autocomplete="off" autofocus>
                    <button type="submit" id="search-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                </form>
            </div>

            <div class="shortcuts">
                <a href="https://www.youtube.com" class="shortcut-card" title="YouTube"><img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" alt="YouTube"></a>
                <a href="https://www.github.com" class="shortcut-card" title="GitHub"><img src="https://www.google.com/s2/favicons?domain=github.com&sz=64" alt="GitHub"></a>
                <a href="https://web.whatsapp.com" class="shortcut-card" title="WhatsApp"><img src="https://www.google.com/s2/favicons?domain=whatsapp.com&sz=64" alt="WhatsApp"></a>
                <a href="https://www.google.com" class="shortcut-card" title="Google"><img src="https://www.google.com/s2/favicons?domain=google.com&sz=64" alt="Google"></a>
                <a href="https://www.instagram.com" class="shortcut-card" title="Instagram"><img src="https://www.google.com/s2/favicons?domain=instagram.com&sz=64" alt="Instagram"></a>
                <a href="https://www.canva.com" class="shortcut-card" title="Canva"><img src="https://www.google.com/s2/favicons?domain=canva.com&sz=64" alt="Canva"></a>
            </div>
        </div>
    </div>
    
    <button id="settings-btn">⚙️</button>

    <div id="settings-panel" class="hidden">
        <div class="settings-header">
            <h3>Configurações</h3>
            <button id="close-settings" title="Fechar">✕</button>
        </div>
        
        <div class="setting-item">
            <label for="wallpaper-file">Alterar Wallpaper (Local):</label>
            <input type="file" id="wallpaper-file" accept="video/mp4, video/webm">
        </div>

        <div class="setting-item">
            <label class="checkbox-label">
                <input type="checkbox" id="toggle-clock"> Exibir Relógio
            </label>
        </div>

        <button id="save-settings">Salvar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
